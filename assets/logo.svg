<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf9f6"/>
      <stop offset="100%" stop-color="#f5ecd9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="96" height="96" fill="url(#bg)" stroke="#d9c9a3" stroke-width="2" rx="20"/>

  <!-- Open book icon -->
  <g transform="translate(48, 50)">
    <!-- Left page -->
    <path d="M -22 -18 Q -22 -20 -20 -20 L -4 -20 L -4 16 L -20 16 Q -22 16 -22 14 Z"
          fill="#fff" stroke="#3b3b3b" stroke-width="1.5"/>
    <!-- Right page -->
    <path d="M 22 -18 Q 22 -20 20 -20 L 4 -20 L 4 16 L 20 16 Q 22 16 22 14 Z"
          fill="#fff" stroke="#3b3b3b" stroke-width="1.5"/>
    <!-- Spine -->
    <line x1="0" y1="-20" x2="0" y2="16" stroke="#3b3b3b" stroke-width="1.5"/>
    <!-- Text lines on left page -->
    <line x1="-18" y1="-14" x2="-8" y2="-14" stroke="#999" stroke-width="1"/>
    <line x1="-18" y1="-8" x2="-8" y2="-8" stroke="#999" stroke-width="1"/>
    <line x1="-18" y1="-2" x2="-8" y2="-2" stroke="#999" stroke-width="1"/>
    <line x1="-18" y1="4" x2="-8" y2="4" stroke="#999" stroke-width="1"/>
    <!-- Text lines on right page -->
    <line x1="8" y1="-14" x2="18" y2="-14" stroke="#999" stroke-width="1"/>
    <line x1="8" y1="-8" x2="18" y2="-8" stroke="#999" stroke-width="1"/>
    <line x1="8" y1="-2" x2="18" y2="-2" stroke="#999" stroke-width="1"/>
    <line x1="8" y1="4" x2="18" y2="4" stroke="#999" stroke-width="1"/>
  </g>
</svg>
