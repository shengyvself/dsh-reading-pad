<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .h1 { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1e1e1e; }
      .tagline { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #555; }
      .theme-label { font: 700 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .sample-title { font: 700 14px 'Noto Serif SC', 'Songti SC', serif; }
      .sample-body { font: 400 12px 'Noto Serif SC', 'Songti SC', serif; line-height: 1.6; }
      .meta { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #888; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="#f7f7f8" rx="12"/>

  <!-- Header: logo + tagline -->
  <g transform="translate(60, 40)">
    <text x="0" y="30" class="h1">📖 dsh-reading-pad</text>
    <text x="0" y="55" class="tagline">沉浸式只读阅读板 · Immersive read-only reading panel</text>
  </g>

  <!-- Three theme cards -->
  <!-- Paper -->
  <g transform="translate(60, 130)">
    <rect width="340" height="330" fill="#faf9f6" stroke="#e5e4df" stroke-width="1" rx="8"/>
    <rect x="20" y="20" width="60" height="8" fill="#faf9f6"/>
    <text x="20" y="45" class="theme-label" fill="#3b3b3b">Paper</text>
    <text x="120" y="45" class="meta">#faf9f6 / #3b3b3b</text>
    <line x1="20" y1="60" x2="320" y2="60" stroke="#e5e4df"/>

    <!-- Sample content -->
    <text x="30" y="90" class="sample-title" fill="#3b3b3b">第一章 · 风起</text>
    <text x="30" y="120" class="sample-body" fill="#3b3b3b">
      <tspan x="30">那是深秋的清晨，</tspan>
      <tspan x="42" dy="18">雾还没有散，</tspan>
      <tspan x="42" dy="18">他站在城门口，</tspan>
      <tspan x="42" dy="18">看着马车一辆辆</tspan>
      <tspan x="42" dy="18">驶出城门。</tspan>
    </text>

    <!-- Progress bar -->
    <rect x="30" y="290" width="280" height="4" fill="#e5e4df" rx="2"/>
    <rect x="30" y="290" width="90" height="4" fill="#3b3b3b" rx="2"/>
    <text x="30" y="312" class="meta" fill="#888">32% · 第 1 章 / 共 12 章</text>
  </g>

  <!-- Sepia -->
  <g transform="translate(430, 130)">
    <rect width="340" height="330" fill="#f5ecd9" stroke="#d9c9a3" stroke-width="1" rx="8"/>
    <text x="20" y="45" class="theme-label" fill="#4a4438">Sepia</text>
    <text x="120" y="45" class="meta">#f5ecd9 / #4a4438</text>
    <line x1="20" y1="60" x2="320" y2="60" stroke="#d9c9a3"/>

    <text x="30" y="90" class="sample-title" fill="#4a4438">第一章 · 风起</text>
    <text x="30" y="120" class="sample-body" fill="#4a4438">
      <tspan x="30">那是深秋的清晨，</tspan>
      <tspan x="42" dy="18">雾还没有散，</tspan>
      <tspan x="42" dy="18">他站在城门口，</tspan>
      <tspan x="42" dy="18">看着马车一辆辆</tspan>
      <tspan x="42" dy="18">驶出城门。</tspan>
    </text>

    <rect x="30" y="290" width="280" height="4" fill="#d9c9a3" rx="2"/>
    <rect x="30" y="290" width="90" height="4" fill="#4a4438" rx="2"/>
    <text x="30" y="312" class="meta" fill="#888">32% · 第 1 章 / 共 12 章</text>
  </g>

  <!-- Night -->
  <g transform="translate(800, 130)">
    <rect width="340" height="330" fill="#1e1e1e" stroke="#333" stroke-width="1" rx="8"/>
    <text x="20" y="45" class="theme-label" fill="#b0b0b0">Night</text>
    <text x="120" y="45" class="meta" fill="#777">#1e1e1e / #b0b0b0</text>
    <line x1="20" y1="60" x2="320" y2="60" stroke="#333"/>

    <text x="30" y="90" class="sample-title" fill="#b0b0b0">第一章 · 风起</text>
    <text x="30" y="120" class="sample-body" fill="#b0b0b0">
      <tspan x="30">那是深秋的清晨，</tspan>
      <tspan x="42" dy="18">雾还没有散，</tspan>
      <tspan x="42" dy="18">他站在城门口，</tspan>
      <tspan x="42" dy="18">看着马车一辆辆</tspan>
      <tspan x="42" dy="18">驶出城门。</tspan>
    </text>

    <rect x="30" y="290" width="280" height="4" fill="#333" rx="2"/>
    <rect x="30" y="290" width="90" height="4" fill="#b0b0b0" rx="2"/>
    <text x="30" y="312" class="meta" fill="#777">32% · 第 1 章 / 共 12 章</text>
  </g>

  <!-- Footer badges (rendered as SVG shapes) -->
  <g transform="translate(60, 470)">
    <text class="meta" fill="#888">三主题 · 30em 限宽 · 进度条 · 章节浏览 · 滚动位置持久化</text>
  </g>
</svg>
